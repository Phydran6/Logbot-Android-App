# Xcode-Projekt aus einer Textdatei.
#
# Warum kein eingechecktes .xcodeproj: Die project.pbxproj ist eine
# generierte Datei, die bei jeder Aenderung in Xcode neu durchgewuerfelt wird.
# Im Repository erzeugt sie Konflikte, die niemand sinnvoll aufloesen kann.
# XcodeGen baut sie aus dieser Datei - lesbar, vergleichbar, ohne Konflikte.
#
# Erzeugen:  bash scripts/ensure_ios_project.sh

name: Logbot

options:
  bundleIdPrefix: de.phytech
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "352N56D836"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Logbot:
    type: application
    platform: iOS
    sources:
      - path: Logbot
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.phytech.logbot
        PRODUCT_NAME: Logbot
        INFOPLIST_FILE: Logbot/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone und iPad. Die Ansichten sind Listen und passen sich selbst an.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        # Signatur kommt aus dem match-Profil, nicht aus Xcodes Automatik.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore de.phytech.logbot"

schemes:
  Logbot:
    build:
      targets:
        Logbot: all
    run:
      config: Debug
    archive:
      config: Release
