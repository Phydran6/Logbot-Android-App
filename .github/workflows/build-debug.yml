name: Build & Release

on:
  push:
    branches: [main, native-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      do_release:
        description: "Finale Release-Version bauen (sauberer Datum-Uhrzeit-Stempel, echtes Release statt Vorschau)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle History für Git-basiertes Auto-Versioning (versionCode = Commit-Anzahl)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute version
        id: ver
        run: |
          CODE=$(git rev-list --count HEAD)
          if [ "${{ github.event.inputs.do_release }}" = "true" ]; then
            # Finale Release: sauberer Zeitstempel = Build-Zeitpunkt (Europe/Berlin), ohne -alpha
            NAME=$(TZ=Europe/Berlin date +%Y.%m.%d.%H.%M.%S)
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # Vorschau: Commit-Datum + -alpha + Kurz-SHA
            SHA=$(git rev-parse --short HEAD)
            DATE=$(git show -s --format=%cd --date=format:%Y.%m.%d.%H.%M.%S HEAD)
            NAME="${DATE}-alpha.${SHA}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "App-Version: $NAME (versionCode $CODE)"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PlogbotVersionCode=${{ steps.ver.outputs.code }} \
            -PlogbotVersionName=${{ steps.ver.outputs.name }} 2>&1 | tee build.log

      # Diagnose-Hilfe: bei Fehlschlag das Ende des Build-Logs als Commit-Kommentar posten
      # (nutzt das eingebaute GITHUB_TOKEN; Kommentar ist über die öffentliche API lesbar).
      - name: APK einsammeln & umbenennen
        run: |
          mkdir -p out
          ls -laR app/build/outputs/apk 2>&1 | tee -a build.log || true
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          echo "Gefundene APK: '$APK'" | tee -a build.log
          test -n "$APK"
          cp "$APK" "out/Logbot-${{ steps.ver.outputs.name }}.apk"

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Logbot-App
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # Direkter Download: GitHub-Release. Push -> rollende Vorschau (Tag native-latest);
      # manueller Lauf mit do_release=true -> echtes Release (Tag v<Zeitstempel>).
      - name: Als Download veröffentlichen (GitHub Release)
        if: success() && (github.event_name == 'push' || github.event.inputs.do_release == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          APK="out/Logbot-${VER}.apk"
          if [ "${{ steps.ver.outputs.release }}" = "true" ]; then
            gh release create "v${VER}" "$APK" \
              --title "Logbot ${VER}" \
              --notes "Native Logbot-App – finale Version ${VER}." \
              --target native-rewrite || true
          else
            gh release delete native-latest --yes --cleanup-tag || true
            gh release create native-latest "$APK" \
              --title "Logbot – Vorschau (${VER})" \
              --notes "Automatischer Vorschau-Build vom Branch native-rewrite zum Testen. Version ${VER}." \
              --prerelease --target native-rewrite || true
          fi

      # Diagnose: bei Fehlschlag die eigentliche Fehlerursache als Commit-Kommentar posten
      - name: Report error as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### What went wrong"
            sed -n '/\* What went wrong:/,/\* Try:/p' build.log
            echo
            echo "### Fehler-/Compiler-Zeilen"
            grep -nE "^e: |^w: |: error:|FAILURE|Caused by|A problem occurred|Could not|Unsupported|Cannot|Configuration cache problems|BUILD FAILED" build.log | head -n 60
          } > report.txt
          echo "----- report.txt -----"; cat report.txt
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat report.txt)" || true
