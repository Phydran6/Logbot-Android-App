name: Build Debug APK

on:
  push:
    branches: [main, native-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle History für Git-basiertes Auto-Versioning (versionCode = Commit-Anzahl)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute version from Git
        id: ver
        run: |
          CODE=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          DATE=$(git show -s --format=%cd --date=format:%Y.%m.%d.%H.%M.%S HEAD)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$DATE-alpha.$SHA" >> "$GITHUB_OUTPUT"
          echo "App-Version: $DATE-alpha.$SHA (versionCode $CODE)"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PlogbotVersionCode=${{ steps.ver.outputs.code }} \
            -PlogbotVersionName=${{ steps.ver.outputs.name }} 2>&1 | tee build.log

      # Diagnose-Hilfe: bei Fehlschlag das Ende des Build-Logs als Commit-Kommentar posten
      # (nutzt das eingebaute GITHUB_TOKEN; Kommentar ist über die öffentliche API lesbar).
      - name: Collect & rename APK
        run: |
          mkdir -p out
          echo "=== APK-Ausgabeverzeichnis ===" | tee -a build.log
          ls -laR app/build/outputs/apk 2>&1 | tee -a build.log || true
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          echo "Gefundene APK: '$APK'" | tee -a build.log
          test -n "$APK"
          SHA_SHORT="${GITHUB_SHA::7}"
          cp "$APK" "out/logbot-debug-${SHA_SHORT}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: logbot-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # Diagnose: bei Fehlschlag die eigentliche Fehlerursache als Commit-Kommentar posten
      - name: Report error as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### What went wrong"
            sed -n '/\* What went wrong:/,/\* Try:/p' build.log
            echo
            echo "### Fehler-/Compiler-Zeilen"
            grep -nE "^e: |^w: |: error:|FAILURE|Caused by|A problem occurred|Could not|Unsupported|Cannot|Configuration cache problems|BUILD FAILED" build.log | head -n 60
          } > report.txt
          echo "----- report.txt -----"; cat report.txt
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat report.txt)" || true
