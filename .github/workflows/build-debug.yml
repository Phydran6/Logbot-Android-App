name: Build Debug APK

on:
  push:
    branches: [main, native-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with commit SHA
        run: |
          mkdir -p out
          SHA_SHORT="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "out/logbot-debug-${SHA_SHORT}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: logbot-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
