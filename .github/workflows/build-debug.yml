name: Build Debug APK

on:
  push:
    branches: [main, native-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle History für Git-basiertes Auto-Versioning (versionCode = Commit-Anzahl)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute version from Git
        id: ver
        run: |
          CODE=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          DATE=$(git show -s --format=%cd --date=format:%Y.%m.%d.%H.%M.%S HEAD)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$DATE-alpha.$SHA" >> "$GITHUB_OUTPUT"
          echo "App-Version: $DATE-alpha.$SHA (versionCode $CODE)"

      - name: Build debug APK
        run: >
          ./gradlew assembleDebug --no-daemon --stacktrace
          -PlogbotVersionCode=${{ steps.ver.outputs.code }}
          -PlogbotVersionName=${{ steps.ver.outputs.name }}

      - name: Rename APK with commit SHA
        run: |
          mkdir -p out
          SHA_SHORT="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "out/logbot-debug-${SHA_SHORT}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: logbot-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
