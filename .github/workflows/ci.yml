name: CI

# Bei jedem Push und jedem Pull Request: bauen und testen.
#
# Der Debug-APK haengt 30 Tage als Artefakt am Lauf - damit laesst sich jeder
# Stand ausprobieren, ohne ein Release zu erzeugen.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # write statt read: Der Diagnose-Schritt unten postet die Gradle-
  # Fehlerursache als Commit-Kommentar. Die Protokolle eines Laufs sind ueber
  # die API nur mit Token lesbar, ein Commit-Kommentar dagegen oeffentlich.
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android bauen und testen
    runs-on: ubuntu-latest
    # Ohne Grenze haengt ein blockierter Lauf bis zum Standard-Limit von
    # sechs Stunden und blockiert dabei die Nebenlaeufigkeitsgruppe.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle-Zwischenstaende puffern
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: gradlew ausfuehrbar machen
        run: chmod +x android/gradlew

      # Ein Gradle-Aufruf statt drei: Die Konfigurationsphase laeuft damit
      # einmal statt dreimal, und das ist bei kaltem Puffer der teuerste Teil.
      # Lint bricht dabei nicht ab (siehe lint-Block in app/build.gradle.kts) -
      # ein Hinweis auf eine veraltete API soll den Lauf melden, nicht stoppen.
      - name: Tests, Lint und Debug-APK
        working-directory: android
        run: |
          # pipefail, damit tee den Fehlschlag von gradlew nicht verschluckt.
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Diagnose: Bei Fehlschlag die eigentliche Ursache als Commit-Kommentar
      # posten. Die Protokolle eines Actions-Laufs sind ueber die API nur mit
      # Token lesbar - ein Commit-Kommentar ist es ohne. Ohne diesen Schritt
      # steht man vor einem roten Lauf, ohne zu wissen, woran er lag.
      - name: Fehlerursache als Commit-Kommentar melden
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=android/build.log
          [ -f "$log" ] || { echo "Kein build.log - der Fehlschlag lag vor Gradle."; exit 0; }
          {
            echo "### Gradle: What went wrong"
            sed -n "/\* What went wrong:/,/\* Try:/p" "$log"
            echo
            echo "### Fehler- und Compiler-Zeilen"
            grep -nE "^e: |^w: |: error:|FAILURE|Caused by|A problem occurred|Could not|Unsupported|Cannot|Configuration cache problems|BUILD FAILED" "$log" | head -n 60
          } > bericht.txt
          echo "----- bericht.txt -----"; cat bericht.txt
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat bericht.txt)" || true

      - name: APK mit Commit-Kuerzel benennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/logbot-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: logbot-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS bauen (unsigniert)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Projekt erzeugen
        run: bash scripts/ensure_ios_project.sh

      # Ohne Signatur: Die CI soll pruefen, ob der Swift-Code uebersetzt -
      # dafuer braucht es keinen Apple-Zugang. Signiert wird erst im Release.
      - name: Uebersetzen
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Logbot.xcodeproj \
            -scheme Logbot \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -quiet
