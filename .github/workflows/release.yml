name: Release

# Ausloeser: Tag im Format v1.2.3 pushen.
#   git tag v1.0.0 && git push origin v1.0.0
#
# Ergebnis: signiertes AAB + APK, iOS-IPA (falls die Apple-Secrets stehen),
# GitHub-Release mit den Changelog-Notizen zur Version.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v-Praefix, z.B. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: Version und Release-Notizen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ios_version: ${{ steps.v.outputs.ios_version }}
      build_number: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Apple erlaubt in CFBundleShortVersionString nur Ziffern und
          # hoechstens drei Punkte. `1.0.0-beta.2` lehnt App Store Connect mit
          # ITMS-90060 ab, Android nimmt es anstandslos. Fuer iOS wird der
          # Vorabzusatz deshalb abgeschnitten: 1.0.0-beta.2 -> 1.0.0
          #
          # Verwechslungsgefahr gibt es nicht: Innerhalb einer Version
          # unterscheidet die Build-Nummer die Uploads, und die zaehlt mit
          # jedem CI-Lauf hoch.
          echo "ios_version=${version%%-*}" >> "$GITHUB_OUTPUT"
          echo "Android: $version / iOS: ${version%%-*}"

      - name: Release-Notizen aus dem Changelog schneiden
        run: bash scripts/extract_changelog.sh "${{ steps.v.outputs.version }}" > RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  android:
    name: Android-Release bauen
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Keystore und signing.properties schreiben
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Android-Keystore hinterlegt - es wird mit dem Debug-Key gebaut. Play nimmt so ein Paket nicht an."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # storeFile wird relativ zum Modul :app aufgeloest.
          cat > android/signing.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: gradlew ausfuehrbar machen
        run: chmod +x android/gradlew

      - name: AAB und APK bauen
        working-directory: android
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # versionCode startet bei 100: Die letzte von Hand gebaute Release
          # trug die 4, und Play nimmt keinen Rueckwaertsschritt an.
          code=$((100 + RUN_NUMBER))
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace \
            -Plogbot.versionName="$VERSION" \
            -Plogbot.versionCode="$code"

      - name: Artefakte benennen
        run: |
          # Am Dateinamen soll stehen, was man geladen hat: Programm, Version
          # und wofuer die Datei gedacht ist.
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release/Logbot-${v}-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "release/Logbot-${v}-android-playstore.aab"
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*

  ios:
    name: iOS-Release bauen
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Projekt erzeugen
        run: bash scripts/ensure_ios_project.sh

      - name: Signatur verfuegbar?
        id: signing
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          # Alle sechs pruefen, nicht nur eines. Fehlt nur der Git-Token,
          # laeuft der Ablauf weiter und scheitert spaeter mit "could not read
          # Password" - das liest sich wie ein falsches MATCH_PASSWORD und ist
          # etwas voellig anderes.
          if bash scripts/check_apple_secrets.sh --soft; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple-Zugang unvollstaendig - iOS wird nur unsigniert gebaut."
          fi

      - name: Unsigniert bauen
        if: steps.signing.outputs.available == 'false'
        working-directory: ios
        env:
          IOS_VERSION: ${{ needs.prepare.outputs.ios_version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Logbot.xcodeproj \
            -scheme Logbot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION="$IOS_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -quiet

          # Ohne Apple-Zugang gibt es kein installierbares IPA. Damit trotzdem
          # etwas Greifbares im Release liegt, wird die gebaute App als
          # unsigniertes IPA verpackt - zum Signieren oder Sideloaden.
          mkdir -p build/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Logbot.app build/Payload/
          cd build
          zip -qry "Logbot-${{ needs.prepare.outputs.version }}-ios-unsigniert.ipa" Payload
          rm -rf Payload

      - name: Zugriff auf das match-Repository
        if: steps.signing.outputs.available == 'true'
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          # Gleich hier pruefen, statt es fastlane 20 Minuten spaeter
          # herausfinden zu lassen. Das Skript unterscheidet Tippfehler in der
          # URL, abgelaufenen Token und fehlendes Schreibrecht.
          bash scripts/check_match_repo.sh
          # Ohne das wartet git bei fehlendem Zugriff auf eine Eingabe und
          # meldet dann "could not read Password" - eine Meldung, die auf die
          # falsche Spur fuehrt.
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Signiertes IPA bauen
        if: steps.signing.outputs.available == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          gem install fastlane --no-document
          bash scripts/run_fastlane.sh build_release \
            version:"${{ needs.prepare.outputs.ios_version }}" \
            build_number:"${{ needs.prepare.outputs.build_number }}"

      - name: Signiertes IPA benennen
        if: steps.signing.outputs.available == 'true'
        run: |
          # Im Release soll am Namen stehen, was drin ist - und vor allem,
          # dass das ein App-Store-Build ist, den man nicht sideloaden kann.
          v="${{ needs.prepare.outputs.version }}"
          mv ios/build/Logbot.ipa "ios/build/Logbot-${v}-ios-appstore.ipa"
          ls -lh ios/build/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ios/build/*.ipa
          if-no-files-found: ignore

  publish:
    name: GitHub-Release veroeffentlichen
    runs-on: ubuntu-latest
    needs: [prepare, android, ios]
    # Android muss stehen. iOS darf fehlen - ohne Apple-Zugang wird dort nur
    # unsigniert gebaut, das soll das Release nicht blockieren.
    if: always() && needs.android.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Logbot v${{ needs.prepare.outputs.version }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            artifacts/android-release/*.apk
            artifacts/android-release/*.aab
            artifacts/ios-release/*.ipa
